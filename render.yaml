# Native Python (no Docker) — Render Blueprint
# Dashboard: New → Blueprint → Alexaliao001/quantradar
services:
  - type: web
    name: quantradar-shell
    runtime: python
    plan: free
    region: oregon
    buildCommand: "python -c \"print('stdlib shell, no deps')\""
    startCommand: "python -m app"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: HOST
        value: "0.0.0.0"
      # PORT is injected by Render — do not set in blueprint
      - key: QUANTRADAR_MODE
        value: artifact
      - key: PUBLIC_BASE_URL
        value: https://quantradar.one
      - key: SESSION_SECRET
        generateValue: true
      - key: QUANTRADAR_DEV_LOGIN
        value: "0"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: QUANTRADAR_STRIPE_SECRET_KEY
        sync: false
