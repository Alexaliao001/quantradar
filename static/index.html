<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuantRadar Shell</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #121a24;
      --text: #e7eef7;
      --muted: #8b9bb0;
      --accent: #3d8bfd;
      --ok: #3ecf8e;
      --warn: #f0b429;
      --border: #1e2a3a;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--sans);
      background: radial-gradient(1200px 600px at 10% -10%, #152033 0%, var(--bg) 55%);
      color: var(--text);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: 0.04em;
      font-weight: 600;
    }
    header span { color: var(--muted); font-size: 0.85rem; }
    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
    }
    label { display: block; color: var(--muted); font-size: 0.8rem; margin-bottom: 0.35rem; }
    .row { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: end; }
    input {
      background: #0a1018;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 0.55rem 0.7rem;
      font-family: var(--mono);
      font-size: 0.95rem;
      min-width: 8rem;
    }
    button {
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 0.6rem 1.1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: wait; }
    .meta {
      margin-top: 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
    }
    .kpi {
      background: #0a1018;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
    }
    .kpi b { display: block; font-size: 1.25rem; margin-top: 0.2rem; font-family: var(--mono); }
    .kpi small { color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.7rem; }
    pre {
      margin-top: 1rem;
      background: #0a1018;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      overflow: auto;
      font-family: var(--mono);
      font-size: 0.78rem;
      line-height: 1.45;
      max-height: 420px;
    }
    .status { margin-top: 0.75rem; color: var(--muted); font-size: 0.85rem; }
    .status.ok { color: var(--ok); }
    .status.warn { color: var(--warn); }
  </style>
</head>
<body>
  <header>
    <h1>QuantRadar · path C shell</h1>
    <span id="healthLine">health…</span>
  </header>
  <main>
    <section class="panel">
      <div class="row">
        <div>
          <label for="ticker">Ticker</label>
          <input id="ticker" value="INTC" maxlength="10" autocomplete="off" />
        </div>
        <div>
          <label for="sector">Sector ETF (optional)</label>
          <input id="sector" placeholder="SMH" maxlength="8" autocomplete="off" />
        </div>
        <button id="run" type="button">Analyze</button>
      </div>
      <p class="status" id="status">Ready — default mode reads charts artifact (no live key required).</p>
      <div class="meta" id="kpis" hidden>
        <div class="kpi"><small>Signal</small><b id="kSignal">—</b></div>
        <div class="kpi"><small>Score</small><b id="kScore">—</b></div>
        <div class="kpi"><small>Gate</small><b id="kGate">—</b></div>
        <div class="kpi"><small>Mode</small><b id="kMode">—</b></div>
      </div>
      <pre id="out">{}</pre>
    </section>
  </main>
  <script>
    async function refreshHealth() {
      try {
        const r = await fetch("/health");
        const j = await r.json();
        document.getElementById("healthLine").textContent =
          `ok=${j.ok} sha=${j.git_sha || "n/a"} charts=${j.charts_reachable} mode=${j.mode_default}`;
      } catch (e) {
        document.getElementById("healthLine").textContent = "health unreachable";
      }
    }
    async function runAnalyze() {
      const ticker = document.getElementById("ticker").value.trim();
      const sector = document.getElementById("sector").value.trim();
      const btn = document.getElementById("run");
      const status = document.getElementById("status");
      btn.disabled = true;
      status.className = "status";
      status.textContent = "Analyzing…";
      try {
        const q = new URLSearchParams({ ticker });
        if (sector) q.set("sector", sector);
        const r = await fetch("/api/analyze?" + q.toString());
        const j = await r.json();
        document.getElementById("out").textContent = JSON.stringify(j, null, 2);
        document.getElementById("kpis").hidden = false;
        document.getElementById("kSignal").textContent = (j.gate && j.gate.signal) || "—";
        document.getElementById("kScore").textContent =
          j.score && j.score.final != null ? `${j.score.final}/${j.score.scale}` : "—";
        document.getElementById("kGate").textContent =
          (j.gate && (j.gate.state_code || j.gate.state_name)) || "—";
        document.getElementById("kMode").textContent = (j.meta && j.meta.mode) || "—";
        status.className = j.ok ? "status ok" : "status warn";
        status.textContent = j.ok
          ? (j.degraded ? "OK (degraded) — see warnings" : "OK — ENGINE_CONTRACT response")
          : ("Failed: " + (j.error || "see body"));
      } catch (e) {
        status.className = "status warn";
        status.textContent = String(e);
      } finally {
        btn.disabled = false;
      }
    }
    document.getElementById("run").addEventListener("click", runAnalyze);
    document.getElementById("ticker").addEventListener("keydown", (e) => {
      if (e.key === "Enter") runAnalyze();
    });
    refreshHealth();
  </script>
</body>
</html>
