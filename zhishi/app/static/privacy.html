    <h1 class="brand">隐私政策</h1>
    <div class="panel muted">
      <p>我们仅收集提供教育服务所必需的信息。</p>
      <p>1. 会话标识、复盘本与错题本内容存储于服务端（MVP 可为内存/数据库）。</p>
      <p>2. 支付由微信支付等合规通道处理；我们不存储完整银行卡信息。</p>
      <p>3. 不会出售你的复盘内容；不会用「晒单收益榜」公开你的假设原文。</p>
      <p>4. 你可请求导出或删除个人复盘数据（联系运营邮箱，上线后公示）。</p>

    <p class="disclaimer">本产品为投资教育工具，不构成任何投资建议。</p>
  </div>
